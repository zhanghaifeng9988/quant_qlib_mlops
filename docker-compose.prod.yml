name: quant-qlib-mlops-prod

volumes:
  grafana_data: {}
  postgres_data: {}

networks:
  front-tier:
  back-tier:

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: metrics
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - back-tier

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - back-tier
      - front-tier

  grafana:
    image: grafana/grafana-enterprise:11.2.0
    user: "472"
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./monitoring/config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - back-tier
      - front-tier

  api:
    image: ghcr.io/zhanghaifeng9988/quant_qlib_mlops:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_ALIAS: candidate
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/home/mlops/quant_qlib_mlops/mlruns
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
