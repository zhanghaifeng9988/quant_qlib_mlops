qlib_init:
    provider_uri: "/home/mlops/quant_qlib_mlops/data/qlib_bin/us_data"
    region: us
    exp_manager:
        class: MLflowExpManager
        module_path: qlib.workflow.expm
        kwargs:
            uri: "sqlite:////home/mlops/quant_qlib_mlops/mlflow.db"  #mlflow.db 会生成在你执行 qrun 的当前目录（项目根目录）
            default_exp_name: "workflow1"

# all 表示：使用本地 instruments/all.txt 文件里包含的所有股票
market: &market all   # 后面的代码里只要写 *market，  YAML就会自动把它替换成 all，
#benchmark: &benchmark all   # 是临时方案，后期 补 SPX 数据后，改回。
benchmark: &benchmark SPX    # 已经取得SPX数据

# 数据与特征处理 
# fit_start_time 到 fit_end_time 是用来计算特征标准化（Z-score）参数的。
# 它只允许模型看 2017 年底之前的数据来算均值和方差，防止发生“未来信息泄露”。
data_handler_config: &data_handler_config
    start_time: 2011-10-24
    end_time: 2026-10-16
    fit_start_time: 2011-10-24
    fit_end_time: 2017-12-31
    instruments: *market   # 用全部股票

# 回测策略设置
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy # Qlib 最经典的选股策略。
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED> # 这是一个占位符，Qlib 会自动把 LightGBM 预测出的分数填进来。
            topk: 50 # 初次买入模型预测分数最高的 50 只股票，在后续的每一天，保证持仓总数永远是 50 只，（卖出了几只，就补充几只）
            n_drop: 5 # 每天卖掉手里分数最差的 5 只，换成没买入的里面分数最高的 5 只（保持 50 只持仓，降低换手率）。
    backtest:
        start_time: 2019-01-01
        end_time: 2019-12-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null  # 涨跌停限制阈值
            deal_price: close    # 当日收盘价作为成交价格。理想状态：现实中如果用这个参数，则需要在收盘前算出来收盘价格，收盘前挂单成交。（这叫“尾盘交易”）
            open_cost: 0.0005   # 买入手续费万分之五
            close_cost: 0.0015   # 卖出手续费万分之十五（含印花税/滑点）
            min_cost: 5          # 最低手续费 5 美元

# 核心引擎：模型设置 (model)
task:
    model:
        class: LGBModel # 该模型预测的结果，是股票的收益率
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse  # 用均方误差来预测未来收益率
            colsample_bytree: 0.8879 # 建每一棵树时，只随机抽取 88.79% 的特征（因子）来训练。Alpha158 有 158 个因子，每次只拿一部分去学，防止某些强因子过度主导模型。
            learning_rate: 0.2     # 学习率，控制每棵树对总模型的贡献程度。数值越小，树越多。
            subsample: 0.8789     # 建每一棵树时，只随机抽取 87.89% 的数据行（天数）来训练。
            lambda_l1: 205.6999    # L1 正则化参数，防止模型过拟合。L1 会让没用的因子权重变成 0（特征选择）
            lambda_l2: 580.9768      # L2 正则化参数，防止模型过拟合。L2 会惩罚过大的权重
            max_depth: 8         # 树的最大深度
            num_leaves: 210      # （最大叶子节点数）
            num_threads: 8       # 用 8 个 CPU 核心同时算，加快训练速度。

    # 数据集设置 (dataset)        
    dataset:
        class: DatasetH   # DatasetH 是 Qlib 内部写好的一个数据处理类
        module_path: qlib.data.dataset #DatasetH的路径
        kwargs:
            handler:
                class: Alpha158  # Qlib 自带的 158 个经典量化因子（均线、动量、波动率、量价背离等）
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2011-10-24, 2017-12-31]
                valid: [2018-01-01, 2018-12-31]
                test: [2019-01-01, 2019-12-31]

    # 结果记录与评估            
    record:
        - class: SignalRecord  # 信号记录：保存模型的预测值
          module_path: qlib.workflow.record_temp
          kwargs:   # 它会保存一份pred.pkl(预测结果文件)。里面记录了‘测试集’被模型打出的预测分数。
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord  # 信号分析记录：
        #：评估模型预测准不准，计算 Rank IC（预测排名和实际排名的相关性），ICIR（IC的稳定性）
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False  # 不做多空对冲分析。如果为 True，它会算“买预测最高的、做空预测最低的”能赚多少钱。
            ann_scaler: 252 # 年化换算系数。因为用的是日频数据，一年的交易日大约 252 天。
        - class: PortAnaRecord  # 组合分析记录：评估策略到底赚不赚钱
        # 把 pred.pkl 喂给前面定义的 TopkDropoutStrategy 策略 ，进行模拟回测
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
