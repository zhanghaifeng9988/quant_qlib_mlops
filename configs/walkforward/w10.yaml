qlib_init:
  provider_uri: /home/mlops/quant_qlib_mlops/data/qlib_bin/us_data
  region: us
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: sqlite:////home/mlops/quant_qlib_mlops/mlflow.db
      default_exp_name: quant_qlib_mlops
market: all
benchmark: SPX
data_handler_config: &id001
  start_time: '2011-10-24'
  end_time: '2026-11-06'
  fit_start_time: '2011-10-24'
  fit_end_time: '2025-12-31'
  instruments: all
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2026-07-01'
    end_time: '2026-11-05'
    account: 100000000
    benchmark: SPX
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 8
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2011-10-24'
        - '2025-12-31'
        valid:
        - '2026-01-01'
        - '2026-06-30'
        test:
        - '2026-07-01'
        - '2026-11-05'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
