apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-api
  template:
    metadata:
      labels:
        app: quant-api
    spec:
      containers:
      - name: quant-api
        image: quant-qlib-api:v2
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "5Gi"
            cpu: "1.0"
          requests:
            memory: "2Gi"
            cpu: "0.5"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: qlib-data
          mountPath: /app/data
        - name: mlflow-db
          mountPath: /app/mlflow.db
        - name: mlruns
          mountPath: /home/mlops/quant_qlib_mlops/mlruns
      volumes:
      - name: qlib-data
        hostPath:
          path: /home/mlops/quant_qlib_mlops/data
          type: Directory
      - name: mlflow-db
        hostPath:
          path: /home/mlops/quant_qlib_mlops/mlflow.db
          type: File
      - name: mlruns
        hostPath:
          path: /home/mlops/quant_qlib_mlops/mlruns
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: quant-api-service
spec:
  selector:
    app: quant-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP