[project]
name = "quant-qlib-mlops"
version = "0.1.0"
description = "An end-to-end MLOps platform for quantitative machine learning, covering data pipelines, experiment tracking, model registry, monitoring, and model serving."
readme = "README.md"
authors = [
    { name = "zhanghaifeng9988", email = "541099040@qq.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quant-qlib-mlops = "quant_qlib_mlops:main"

[dependency-groups]

# 量化研究环境：数据处理、模型训练、实验跟踪
research = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "pyarrow",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pyqlib>=0.9.7,<0.10",
    "lightgbm>=4.7,<5",
    "mlflow>=3.17.2,<4",
    "shap>=0.49.1",
    "yfinance>=1.7.0",
    "python-dotenv>=1.0",
]

# 模型推理环境：FastAPI、MLflow 和 Qlib 模型加载
serving = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "pyarrow",
    "pyqlib>=0.9.7,<0.10",
    "lightgbm>=4.7,<5",
    "mlflow>=3.17.2,<4",
]

# 开发和测试工具
dev = [
    "pytest>=8",
    "ruff",
]

[tool.uv]
# 本地开发默认安装三个依赖组，保持现有开发环境的完整性
default-groups = ["dev", "research", "serving"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
